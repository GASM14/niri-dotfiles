dpi-aware=auto
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty

[colors]
background=1e1e2edd
text=cdd6f4ff
match=f38ba8ff
selection=89b4faff
