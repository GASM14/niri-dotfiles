[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto
prompt="> "
icon-theme=Flat-Remix-Green-Dark
terminal=ghostty -e
launch-prefix=env GDK_BACKEND=wayland
layer=overlay
lines=15
width=60
horizontal-pad=12
vertical-pad=8
inner-pad=4
exit-on-keyboard-focus-loss=no

[colors]
background=1e1e2eff
text=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
border=89b4faff

[border]
width=2
radius=8
