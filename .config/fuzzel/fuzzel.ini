[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty
launch-prefix=

[colors]
background=1e1e2edd
text=cdd6f4ff
match=f38ba8ff
selection=89b4faff
selection-text=1e1e2eff
border=89b4faff

[border]
width=2
radius=10

[dmenu]
mode=text
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g
execute=Return
execute-input=Control+Return
next=Down Tab
prev=Up ISO_Left_Tab
next-page=Page_Down
prev-page=Page_Up
next-with-wrap=none
prev-with-wrap=none
next-column=Right
prev-column=Left
delete-prev=BackSpace
delete-next=Delete
delete-line=Control+u
insert-selected=Control+Tab
first=Home
last=End
